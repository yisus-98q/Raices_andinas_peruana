<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seguir mi pedido — Raíz Andina</title>
<meta name="description" content="Consulta el estado de tu pedido de Raíz Andina con tu código y tu teléfono.">
<link rel="canonical" href="{{SITIO}}/mi-pedido.html">
<link rel="icon" type="image/png" sizes="16x16" href="/img/marca/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/img/marca/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/img/marca/favicon.png">
<meta name="theme-color" content="#0b0a08">
<link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/premium.css">
<link rel="stylesheet" href="/css/paginas.css">
</head>
<body class="pagina pagina-pedido">

<header class="cabecera-simple">
  <div class="contenedor">
    <a class="marca" href="/">
      <img class="marca-sello" src="/img/marca/emblema.png" alt="" width="66" height="66">
      <div>
        <span class="marca-nombre">Raíz <em>Andina</em></span>
        <div class="marca-bajada">Seguimiento de pedido</div>
      </div>
    </a>
    <a class="btn btn-fantasma btn-chico" href="/tienda">Ir a la tienda</a>
  </div>
</header>

<main class="con-fondo fondo-machu">
<div class="contenedor caja-seguimiento">
  <div class="encabezado-centrado">
    <span class="kicker">Tu pedido</span>
    <h1 class="grande">¿Dónde va lo mío?</h1>
    <p class="bajada">
      Escribe el código que te dimos al comprar y los <strong>últimos 4 dígitos</strong>
      del teléfono que dejaste. Pedimos los dos para que nadie más pueda ver tu pedido.
    </p>
  </div>

  <!-- La pasarela: el formulario y el pedido van lado a lado y se desliza de
       uno a otro. Antes el resultado se apilaba debajo del formulario y había
       que bajar media página para leerlo. -->
  <div class="pasarela" id="pasarela">
  <div class="pasarela-pista">
  <form class="asesor-caja pasarela-panel" id="forma">
    <div class="aviso aviso-error" id="error" hidden></div>

    <div class="campo-doble">
      <div class="campo">
        <label for="f-codigo">Código del pedido</label>
        <input id="f-codigo" placeholder="RA-20260910-A1B" autocomplete="off"
               spellcheck="false" maxlength="20" required>
      </div>
      <div class="campo">
        <label for="f-tel4">Últimos 4 del teléfono</label>
        <input id="f-tel4" inputmode="numeric" maxlength="4" placeholder="1447" required>
      </div>
    </div>

    <button class="btn btn-primario btn-bloque" type="submit" id="btn-consultar">
      Ver mi pedido
    </button>
  </form>

  <section class="pedido-estado pasarela-panel oculto" id="resultado" aria-live="polite"></section>
  </div>
  </div>
</div>
</main>
<!-- Sin pie: con él la página medía más que la pantalla y obligaba a bajar
     para nada. "Volver a la tienda" ya está en la cabecera. -->

<script src="/js/mi-pedido.js"></script>
</body>
</html>
